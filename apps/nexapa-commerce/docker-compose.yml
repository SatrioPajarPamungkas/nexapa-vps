services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexapa_commerce
      POSTGRES_USER: nexapa_commerce
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - nexapa-commerce-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexapa_commerce -d nexapa_commerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - nexapa-commerce-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexapa-commerce-postgres:
  nexapa-commerce-redis:
