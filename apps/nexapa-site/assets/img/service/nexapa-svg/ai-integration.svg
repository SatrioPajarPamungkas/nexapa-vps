<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 520 600"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">Integrasi AI dan sistem digital</title>
    <desc id="description">
        Pusat kecerdasan buatan yang terhubung dengan aplikasi dan data.
    </desc>

    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#10172b"/>
            <stop offset="1" stop-color="#080b15"/>
        </linearGradient>

        <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#64ddff"/>
            <stop offset=".48" stop-color="#5979ff"/>
            <stop offset="1" stop-color="#a36dff"/>
        </linearGradient>

        <filter id="glow">
            <feGaussianBlur stdDeviation="12" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <style>
        .link {
            stroke-dasharray: 10 12;
            animation: dash 8s linear infinite;
        }

        .orbit {
            animation: rotate 18s linear infinite;
            transform-origin: 260px 300px;
        }

        .pulse {
            animation: pulse 3.4s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes dash {
            to { stroke-dashoffset: -180; }
        }

        @keyframes rotate {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            50% { opacity: .74; transform: scale(.97); }
        }
    </style>

    <rect
        x="1"
        y="1"
        width="518"
        height="598"
        rx="38"
        fill="url(#bg)"
        stroke="#334064"
        stroke-width="2"
    />

    <g opacity=".13" stroke="#7c8dff">
        <path d="M0 100H520"/>
        <path d="M0 200H520"/>
        <path d="M0 300H520"/>
        <path d="M0 400H520"/>
        <path d="M0 500H520"/>
        <path d="M100 0V600"/>
        <path d="M200 0V600"/>
        <path d="M300 0V600"/>
        <path d="M400 0V600"/>
    </g>

    <text
        x="45"
        y="62"
        fill="#edf2ff"
        font-family="Arial, sans-serif"
        font-size="16"
        font-weight="700"
        letter-spacing="1"
    >
        INTELLIGENT INTEGRATION
    </text>

    <rect
        x="355"
        y="39"
        width="115"
        height="31"
        rx="15"
        fill="#16352f"
        stroke="#317e70"
    />

    <circle cx="374" cy="55" r="5" fill="#53deb7"/>

    <text
        x="387"
        y="59"
        fill="#66e3be"
        font-family="Arial, sans-serif"
        font-size="10"
        font-weight="700"
    >
        CONNECTED
    </text>

    <path
        class="link"
        d="M150 175C205 175 204 250 225 265"
        fill="none"
        stroke="#66d6ff"
        stroke-width="4"
        stroke-linecap="round"
    />

    <path
        class="link"
        d="M370 175C315 175 316 250 295 265"
        fill="none"
        stroke="#9878ff"
        stroke-width="4"
        stroke-linecap="round"
    />

    <path
        class="link"
        d="M150 430C205 430 204 350 225 335"
        fill="none"
        stroke="#51dcb5"
        stroke-width="4"
        stroke-linecap="round"
    />

    <path
        class="link"
        d="M370 430C315 430 316 350 295 335"
        fill="none"
        stroke="#6e88ff"
        stroke-width="4"
        stroke-linecap="round"
    />

    <g>
        <rect
            x="58"
            y="125"
            width="135"
            height="98"
            rx="23"
            fill="#111d30"
            stroke="#315576"
            stroke-width="2"
        />

        <circle cx="95" cy="164" r="17" fill="#193d58"/>

        <path
            d="M85 164h20M95 154v20"
            stroke="#68d9ff"
            stroke-width="4"
            stroke-linecap="round"
        />

        <text
            x="120"
            y="161"
            fill="#f1f5ff"
            font-family="Arial, sans-serif"
            font-size="13"
            font-weight="700"
        >
            Aplikasi
        </text>

        <text
            x="120"
            y="182"
            fill="#7d8ba3"
            font-family="Arial, sans-serif"
            font-size="10"
        >
            Sistem bisnis
        </text>
    </g>

    <g>
        <rect
            x="327"
            y="125"
            width="135"
            height="98"
            rx="23"
            fill="#111d30"
            stroke="#5f4588"
            stroke-width="2"
        />

        <circle cx="364" cy="164" r="17" fill="#382655"/>

        <path
            d="M354 164h20M364 154v20"
            stroke="#b58aff"
            stroke-width="4"
            stroke-linecap="round"
        />

        <text
            x="389"
            y="161"
            fill="#f1f5ff"
            font-family="Arial, sans-serif"
            font-size="13"
            font-weight="700"
        >
            API
        </text>

        <text
            x="389"
            y="182"
            fill="#7d8ba3"
            font-family="Arial, sans-serif"
            font-size="10"
        >
            Integrasi
        </text>
    </g>

    <g>
        <rect
            x="58"
            y="382"
            width="135"
            height="98"
            rx="23"
            fill="#111d30"
            stroke="#266b61"
            stroke-width="2"
        />

        <circle cx="95" cy="421" r="17" fill="#17463d"/>

        <path
            d="M85 421h20M95 411v20"
            stroke="#55deb7"
            stroke-width="4"
            stroke-linecap="round"
        />

        <text
            x="120"
            y="418"
            fill="#f1f5ff"
            font-family="Arial, sans-serif"
            font-size="13"
            font-weight="700"
        >
            Data
        </text>

        <text
            x="120"
            y="439"
            fill="#7d8ba3"
            font-family="Arial, sans-serif"
            font-size="10"
        >
            Informasi
        </text>
    </g>

    <g>
        <rect
            x="327"
            y="382"
            width="135"
            height="98"
            rx="23"
            fill="#111d30"
            stroke="#354f91"
            stroke-width="2"
        />

        <circle cx="364" cy="421" r="17" fill="#213663"/>

        <path
            d="M354 421h20M364 411v20"
            stroke="#7894ff"
            stroke-width="4"
            stroke-linecap="round"
        />

        <text
            x="389"
            y="418"
            fill="#f1f5ff"
            font-family="Arial, sans-serif"
            font-size="13"
            font-weight="700"
        >
            Analitik
        </text>

        <text
            x="389"
            y="439"
            fill="#7d8ba3"
            font-family="Arial, sans-serif"
            font-size="10"
        >
            Insight
        </text>
    </g>

    <circle
        cx="260"
        cy="300"
        r="125"
        fill="#6a72ff"
        opacity=".10"
        filter="url(#glow)"
    />

    <g class="orbit" opacity=".82">
        <circle
            cx="260"
            cy="300"
            r="100"
            fill="none"
            stroke="#8390ff"
            stroke-width="3"
            stroke-dasharray="9 15"
        />

        <circle cx="260" cy="200" r="7" fill="#65dcff"/>
        <circle cx="360" cy="300" r="7" fill="#a77cff"/>
        <circle cx="260" cy="400" r="7" fill="#4bdcb1"/>
        <circle cx="160" cy="300" r="7" fill="#718cff"/>
    </g>

    <g class="pulse">
        <circle
            cx="260"
            cy="300"
            r="70"
            fill="url(#core)"
            filter="url(#glow)"
        />

        <path
            d="M239 270c-17 5-24 24-12 36-9 17 5 34 21 32 8 12 27 12 35 0 17 2 30-15 21-32 12-12 5-31-12-36-4-18-28-24-40-10-12-14-36-8-40 10"
            fill="none"
            stroke="#fff"
            stroke-width="5"
            stroke-linecap="round"
            stroke-linejoin="round"
        />

        <path
            d="M260 255v90M235 285h50M235 315h50"
            fill="none"
            stroke="#fff"
            stroke-width="4"
            stroke-linecap="round"
            opacity=".8"
        />
    </g>

    <text
        x="260"
        y="535"
        fill="#eef2ff"
        font-family="Arial, sans-serif"
        font-size="15"
        font-weight="700"
        text-anchor="middle"
    >
        Nexapa Intelligence Core
    </text>

    <text
        x="260"
        y="559"
        fill="#7f8ca5"
        font-family="Arial, sans-serif"
        font-size="11"
        text-anchor="middle"
    >
        Aplikasi, API, data, dan AI dalam satu sistem
    </text>
</svg>
