<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 520 660"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">
        Ekosistem digital Nexapa yang terhubung
    </title>

    <desc id="description">
        Aplikasi dan workflow terhubung dengan Nexapa Core,
        WhatsApp CRM, data, dan kecerdasan buatan.
    </desc>

    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#121d32"/>
            <stop offset="55%" stop-color="#0b1424"/>
            <stop offset="100%" stop-color="#070c15"/>
        </linearGradient>

        <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#68a2ff"/>
            <stop offset="48%" stop-color="#5d72ff"/>
            <stop offset="100%" stop-color="#9067e9"/>
        </linearGradient>

        <linearGradient id="flow" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#55dfba"/>
            <stop offset="52%" stop-color="#718fff"/>
            <stop offset="100%" stop-color="#a879ff"/>
        </linearGradient>

        <filter id="glow">
            <feGaussianBlur stdDeviation="10" result="blur"/>

            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <style>
        .flow-line {
            stroke-dasharray: 9 12;
            animation: flowMove 9s linear infinite;
        }

        .orbit {
            animation: orbitMove 18s linear infinite;
            transform-origin: 260px 382px;
        }

        .core-pulse {
            animation: corePulse 3.6s ease-in-out infinite;
            transform-origin: 260px 382px;
        }

        .card-one {
            animation: cardFloat 5s ease-in-out infinite;
        }

        .card-two {
            animation: cardFloat 5s ease-in-out infinite;
            animation-delay: 1s;
        }

        @keyframes flowMove {
            to {
                stroke-dashoffset: -170;
            }
        }

        @keyframes orbitMove {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes corePulse {
            50% {
                opacity: .84;
                transform: scale(.975);
            }
        }

        @keyframes cardFloat {
            50% {
                transform: translateY(-4px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .flow-line,
            .orbit,
            .core-pulse,
            .card-one,
            .card-two {
                animation: none;
            }
        }
    </style>

    <!-- Background -->
    <rect
        x="1"
        y="1"
        width="518"
        height="658"
        rx="38"
        fill="url(#bg)"
        stroke="#2e4267"
        stroke-width="2"
    />

    <g
        fill="none"
        stroke="#7187b8"
        stroke-width="1"
        opacity=".11"
    >
        <path d="M0 80H520"/>
        <path d="M0 160H520"/>
        <path d="M0 240H520"/>
        <path d="M0 320H520"/>
        <path d="M0 400H520"/>
        <path d="M0 480H520"/>
        <path d="M0 560H520"/>

        <path d="M80 0V660"/>
        <path d="M160 0V660"/>
        <path d="M240 0V660"/>
        <path d="M320 0V660"/>
        <path d="M400 0V660"/>
        <path d="M480 0V660"/>
    </g>

    <circle
        cx="385"
        cy="192"
        r="142"
        fill="#607eff"
        opacity=".07"
        filter="url(#glow)"
    />

    <circle
        cx="120"
        cy="530"
        r="122"
        fill="#42d8ad"
        opacity=".055"
        filter="url(#glow)"
    />

    <!-- Header -->
    <g>
        <circle cx="46" cy="48" r="6" fill="#fb7185"/>
        <circle cx="68" cy="48" r="6" fill="#fbbf24"/>
        <circle cx="90" cy="48" r="6" fill="#4addb2"/>

        <text
            x="118"
            y="52"
            fill="#e8eefb"
            font-family="Arial, sans-serif"
            font-size="12"
            font-weight="700"
            letter-spacing=".85"
        >
            NEXAPA CONNECTED OPERATIONS
        </text>

        <rect
            x="385"
            y="33"
            width="97"
            height="30"
            rx="15"
            fill="#12382f"
            stroke="#2c9076"
        />

        <circle cx="402" cy="48" r="5" fill="#51dfb7"/>

        <text
            x="415"
            y="52"
            fill="#6ae7c2"
            font-family="Arial, sans-serif"
            font-size="8.5"
            font-weight="700"
        >
            TERHUBUNG
        </text>
    </g>

    <!-- Aplikasi -->
    <g class="card-one">
        <rect
            x="104"
            y="91"
            width="312"
            height="83"
            rx="23"
            fill="#111c30"
            stroke="#39547f"
            stroke-width="2"
        />

        <rect
            x="127"
            y="111"
            width="44"
            height="44"
            rx="13"
            fill="#213b6b"
        />

        <path
            d="M138 133h22M149 122v22"
            stroke="#7a9cff"
            stroke-width="4"
            stroke-linecap="round"
        />

        <text
            x="190"
            y="127"
            fill="#f4f7ff"
            font-family="Arial, sans-serif"
            font-size="16"
            font-weight="700"
        >
            Aplikasi dan Platform
        </text>

        <text
            x="190"
            y="149"
            fill="#8190a8"
            font-family="Arial, sans-serif"
            font-size="10.5"
        >
            Sistem operasional dan layanan digital
        </text>
    </g>

    <path
        class="flow-line"
        d="M260 175V208"
        fill="none"
        stroke="url(#flow)"
        stroke-width="4"
        stroke-linecap="round"
    />

    <!-- Workflow -->
    <g class="card-two">
        <rect
            x="76"
            y="208"
            width="368"
            height="88"
            rx="25"
            fill="#101b2d"
            stroke="#2f766d"
            stroke-width="2"
        />

        <rect
            x="99"
            y="230"
            width="45"
            height="45"
            rx="14"
            fill="#174a40"
        />

        <path
            d="m110 252 8 8 15-19"
            fill="none"
            stroke="#50dfb6"
            stroke-width="4.5"
            stroke-linecap="round"
            stroke-linejoin="round"
        />

        <text
            x="164"
            y="248"
            fill="#f3f8f7"
            font-family="Arial, sans-serif"
            font-size="16"
            font-weight="700"
        >
            Workflow Automation
        </text>

        <text
            x="164"
            y="270"
            fill="#8190a7"
            font-family="Arial, sans-serif"
            font-size="10.5"
        >
            Proses otomatis, konsisten, dan tercatat
        </text>
    </g>

    <path
        class="flow-line"
        d="M260 297V321"
        fill="none"
        stroke="url(#flow)"
        stroke-width="4"
        stroke-linecap="round"
    />

    <!-- Core -->
    <circle
        cx="260"
        cy="382"
        r="96"
        fill="#637cff"
        opacity=".11"
        filter="url(#glow)"
    />

    <g class="orbit" opacity=".82">
        <circle
            cx="260"
            cy="382"
            r="79"
            fill="none"
            stroke="#8194ff"
            stroke-width="3"
            stroke-dasharray="8 13"
        />

        <circle cx="260" cy="303" r="7" fill="#51dfb8"/>
        <circle cx="339" cy="382" r="7" fill="#a479ff"/>
        <circle cx="260" cy="461" r="7" fill="#66d8ff"/>
        <circle cx="181" cy="382" r="7" fill="#7591ff"/>
    </g>

    <g class="core-pulse">
        <circle
            cx="260"
            cy="382"
            r="59"
            fill="url(#core)"
            filter="url(#glow)"
        />

        <circle
            cx="260"
            cy="382"
            r="68"
            fill="none"
            stroke="#8b9dff"
            stroke-width="2"
            opacity=".6"
        />

        <path
            d="M242 365h36M233 382h54M242 399h36"
            stroke="#fff"
            stroke-width="6"
            stroke-linecap="round"
        />
    </g>

    <text
        x="260"
        y="486"
        fill="#f1f4fc"
        font-family="Arial, sans-serif"
        font-size="15"
        font-weight="700"
        text-anchor="middle"
    >
        NEXAPA CORE
    </text>

    <text
        x="260"
        y="507"
        fill="#7f8da4"
        font-family="Arial, sans-serif"
        font-size="9.5"
        text-anchor="middle"
    >
        Pusat integrasi proses dan informasi bisnis
    </text>

    <!-- Produk bawah -->
    <rect
        x="50"
        y="536"
        width="420"
        height="85"
        rx="25"
        fill="#101929"
        stroke="#3c4f75"
        stroke-width="2"
    />

    <g transform="translate(70 553)">
        <rect
            width="111"
            height="51"
            rx="15"
            fill="#122d2a"
            stroke="#2f8173"
        />

        <circle cx="22" cy="25.5" r="8" fill="#4addb2"/>

        <text
            x="39"
            y="22"
            fill="#eaf6f3"
            font-family="Arial, sans-serif"
            font-size="10"
            font-weight="700"
        >
            CRM
        </text>

        <text
            x="39"
            y="37"
            fill="#748a9d"
            font-family="Arial, sans-serif"
            font-size="7.5"
        >
            Komunikasi
        </text>
    </g>

    <g transform="translate(204 553)">
        <rect
            width="111"
            height="51"
            rx="15"
            fill="#15233b"
            stroke="#3b588d"
        />

        <circle cx="22" cy="25.5" r="8" fill="#7391ff"/>

        <text
            x="39"
            y="22"
            fill="#edf1fa"
            font-family="Arial, sans-serif"
            font-size="10"
            font-weight="700"
        >
            DATA
        </text>

        <text
            x="39"
            y="37"
            fill="#79879c"
            font-family="Arial, sans-serif"
            font-size="7.5"
        >
            Informasi
        </text>
    </g>

    <g transform="translate(338 553)">
        <rect
            width="111"
            height="51"
            rx="15"
            fill="#241b3c"
            stroke="#694991"
        />

        <circle cx="22" cy="25.5" r="8" fill="#a477ff"/>

        <text
            x="39"
            y="22"
            fill="#f2edfc"
            font-family="Arial, sans-serif"
            font-size="10"
            font-weight="700"
        >
            AI
        </text>

        <text
            x="39"
            y="37"
            fill="#897f9d"
            font-family="Arial, sans-serif"
            font-size="7.5"
        >
            Analitik
        </text>
    </g>
</svg>
