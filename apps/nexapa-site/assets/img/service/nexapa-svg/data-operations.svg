<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 520 600"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">Data operations dan analitik bisnis</title>
    <desc id="description">
        Dashboard data dengan grafik, database, dan indikator analitik.
    </desc>

    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#101b2d"/>
            <stop offset="1" stop-color="#071018"/>
        </linearGradient>

        <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6ef2cb"/>
            <stop offset="1" stop-color="#2cb69b"/>
        </linearGradient>

        <linearGradient id="chart" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#4ed9b0"/>
            <stop offset="1" stop-color="#6d89ff"/>
        </linearGradient>

        <filter id="glow">
            <feGaussianBlur stdDeviation="9" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <style>
        .line {
            stroke-dasharray: 12 10;
            animation: dash 8s linear infinite;
        }

        .bar {
            transform-box: fill-box;
            transform-origin: bottom;
            animation: bars 4s ease-in-out infinite;
        }

        .pulse {
            animation: pulse 3.5s ease-in-out infinite;
        }

        @keyframes dash {
            to { stroke-dashoffset: -150; }
        }

        @keyframes bars {
            50% { transform: scaleY(.72); }
        }

        @keyframes pulse {
            50% { opacity: .65; }
        }
    </style>

    <rect
        x="1"
        y="1"
        width="518"
        height="598"
        rx="38"
        fill="url(#bg)"
        stroke="#214a4c"
        stroke-width="2"
    />

    <g opacity=".14" stroke="#62dabc">
        <path d="M0 100H520"/>
        <path d="M0 190H520"/>
        <path d="M0 280H520"/>
        <path d="M0 370H520"/>
        <path d="M0 460H520"/>
        <path d="M100 0V600"/>
        <path d="M200 0V600"/>
        <path d="M300 0V600"/>
        <path d="M400 0V600"/>
    </g>

    <circle
        cx="130"
        cy="170"
        r="120"
        fill="#32c7a4"
        opacity=".10"
        filter="url(#glow)"
    />

    <g transform="translate(45 46)">
        <text
            x="0"
            y="15"
            fill="#e9f8f5"
            font-family="Arial, sans-serif"
            font-size="16"
            font-weight="700"
            letter-spacing="1"
        >
            DATA OPERATIONS
        </text>

        <rect
            x="330"
            y="-4"
            width="100"
            height="30"
            rx="15"
            fill="#12372f"
            stroke="#2da88d"
        />

        <circle cx="348" cy="11" r="5" fill="#54e6bd"/>

        <text
            x="361"
            y="15"
            fill="#6ee9c5"
            font-family="Arial, sans-serif"
            font-size="10"
            font-weight="700"
        >
            LIVE DATA
        </text>
    </g>

    <g class="pulse">
        <ellipse
            cx="150"
            cy="170"
            rx="78"
            ry="31"
            fill="url(#green)"
        />

        <path
            d="M72 170v126c0 17 35 31 78 31s78-14 78-31V170"
            fill="#173a3b"
            stroke="#4ee0b6"
            stroke-width="3"
        />

        <ellipse
            cx="150"
            cy="233"
            rx="78"
            ry="31"
            fill="#20534f"
            stroke="#4ee0b6"
            stroke-width="3"
        />

        <ellipse
            cx="150"
            cy="296"
            rx="78"
            ry="31"
            fill="#1b4544"
            stroke="#4ee0b6"
            stroke-width="3"
        />
    </g>

    <g transform="translate(270 120)">
        <rect
            width="190"
            height="230"
            rx="25"
            fill="#101b2c"
            stroke="#314762"
            stroke-width="2"
        />

        <text
            x="24"
            y="38"
            fill="#dfe8f6"
            font-family="Arial, sans-serif"
            font-size="14"
            font-weight="700"
        >
            Performance
        </text>

        <path
            d="M25 181H165"
            stroke="#2f3d54"
            stroke-width="2"
        />

        <rect
            class="bar"
            x="33"
            y="122"
            width="24"
            height="59"
            rx="7"
            fill="#3d5e9c"
        />

        <rect
            class="bar"
            x="70"
            y="92"
            width="24"
            height="89"
            rx="7"
            fill="#5574d9"
            style="animation-delay:.4s"
        />

        <rect
            class="bar"
            x="107"
            y="62"
            width="24"
            height="119"
            rx="7"
            fill="#4ccca9"
            style="animation-delay:.8s"
        />

        <rect
            class="bar"
            x="144"
            y="42"
            width="24"
            height="139"
            rx="7"
            fill="#61e3bd"
            style="animation-delay:1.2s"
        />
    </g>

    <path
        class="line"
        d="M78 435C155 400 205 475 278 420S389 382 446 400"
        fill="none"
        stroke="url(#chart)"
        stroke-width="6"
        stroke-linecap="round"
    />

    <g fill="#7793ff" stroke="#17294e" stroke-width="8">
        <circle cx="78" cy="435" r="10"/>
        <circle cx="278" cy="420" r="10"/>
        <circle cx="446" cy="400" r="10"/>
    </g>

    <rect
        x="72"
        y="495"
        width="376"
        height="58"
        rx="19"
        fill="#101c2b"
        stroke="#2a4656"
    />

    <circle cx="105" cy="524" r="10" fill="#53dfb6"/>

    <text
        x="127"
        y="521"
        fill="#eaf5f3"
        font-family="Arial, sans-serif"
        font-size="14"
        font-weight="700"
    >
        Data Tersinkron
    </text>

    <text
        x="127"
        y="541"
        fill="#77879e"
        font-family="Arial, sans-serif"
        font-size="10"
    >
        Informasi bisnis diperbarui secara otomatis
    </text>
</svg>
