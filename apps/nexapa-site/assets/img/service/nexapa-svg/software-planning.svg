<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 520 600"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">Perencanaan dan pengembangan software</title>
    <desc id="description">
        Diagram arsitektur software dan alur pengembangan sistem.
    </desc>

    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#101a30"/>
            <stop offset="1" stop-color="#070c16"/>
        </linearGradient>

        <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#75a0ff"/>
            <stop offset="1" stop-color="#5368ff"/>
        </linearGradient>

        <filter id="glow">
            <feGaussianBlur stdDeviation="10" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <style>
        .flow {
            stroke-dasharray: 10 12;
            animation: dash 9s linear infinite;
        }

        .float {
            animation: float 5s ease-in-out infinite;
            transform-origin: center;
        }

        .pulse {
            animation: pulse 3s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes dash {
            to { stroke-dashoffset: -180; }
        }

        @keyframes float {
            50% { transform: translateY(-8px); }
        }

        @keyframes pulse {
            50% { opacity: .65; transform: scale(.96); }
        }
    </style>

    <rect
        x="1"
        y="1"
        width="518"
        height="598"
        rx="38"
        fill="url(#bg)"
        stroke="#263756"
        stroke-width="2"
    />

    <g opacity=".16" stroke="#829cff">
        <path d="M0 110H520"/>
        <path d="M0 200H520"/>
        <path d="M0 290H520"/>
        <path d="M0 380H520"/>
        <path d="M0 470H520"/>
        <path d="M90 0V600"/>
        <path d="M180 0V600"/>
        <path d="M270 0V600"/>
        <path d="M360 0V600"/>
        <path d="M450 0V600"/>
    </g>

    <circle
        cx="385"
        cy="190"
        r="125"
        fill="#5368ff"
        opacity=".10"
        filter="url(#glow)"
    />

    <g transform="translate(48 48)">
        <circle cx="10" cy="10" r="7" fill="#fb7185"/>
        <circle cx="34" cy="10" r="7" fill="#fbbf24"/>
        <circle cx="58" cy="10" r="7" fill="#4adbb0"/>

        <text
            x="90"
            y="16"
            fill="#dbe5f8"
            font-family="Arial, sans-serif"
            font-size="15"
            font-weight="700"
            letter-spacing="1"
        >
            NEXAPA SYSTEM DESIGN
        </text>
    </g>

    <g class="float">
        <rect
            x="60"
            y="135"
            width="175"
            height="105"
            rx="22"
            fill="#111d32"
            stroke="#3d5279"
            stroke-width="2"
        />

        <circle cx="93" cy="173" r="17" fill="#253b68"/>

        <path
            d="M85 173h16M93 165v16"
            stroke="#7da1ff"
            stroke-width="4"
            stroke-linecap="round"
        />

        <text
            x="122"
            y="169"
            fill="#f2f6ff"
            font-family="Arial, sans-serif"
            font-size="16"
            font-weight="700"
        >
            Requirement
        </text>

        <text
            x="122"
            y="194"
            fill="#7f8da6"
            font-family="Arial, sans-serif"
            font-size="12"
        >
            Kebutuhan bisnis
        </text>
    </g>

    <path
        class="flow"
        d="M235 187C290 187 290 282 342 282"
        fill="none"
        stroke="#6f8dff"
        stroke-width="4"
        stroke-linecap="round"
    />

    <g class="pulse">
        <rect
            x="315"
            y="230"
            width="145"
            height="120"
            rx="28"
            fill="url(#blue)"
            filter="url(#glow)"
        />

        <path
            d="m367 269-27 22 27 22M408 269l27 22-27 22M395 256l-17 70"
            fill="none"
            stroke="#fff"
            stroke-width="7"
            stroke-linecap="round"
            stroke-linejoin="round"
        />
    </g>

    <path
        class="flow"
        d="M342 350C342 400 225 398 225 445"
        fill="none"
        stroke="#4adbb0"
        stroke-width="4"
        stroke-linecap="round"
    />

    <g class="float" style="animation-delay:1s">
        <rect
            x="75"
            y="420"
            width="300"
            height="105"
            rx="22"
            fill="#101b2c"
            stroke="#2b6f68"
            stroke-width="2"
        />

        <circle cx="112" cy="472" r="20" fill="#173f3d"/>

        <path
            d="m102 472 7 7 14-17"
            fill="none"
            stroke="#50dfb6"
            stroke-width="5"
            stroke-linecap="round"
            stroke-linejoin="round"
        />

        <text
            x="150"
            y="465"
            fill="#f3f7ff"
            font-family="Arial, sans-serif"
            font-size="17"
            font-weight="700"
        >
            Sistem Siap Digunakan
        </text>

        <text
            x="150"
            y="491"
            fill="#8290a8"
            font-family="Arial, sans-serif"
            font-size="12"
        >
            Terukur, stabil, dan dapat dikembangkan
        </text>
    </g>
</svg>
