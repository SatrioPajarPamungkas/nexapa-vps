<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 520 600"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">Workflow automation</title>
    <desc id="description">
        Diagram otomasi yang menghubungkan input, proses, dan output.
    </desc>

    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#15152d"/>
            <stop offset="1" stop-color="#090b17"/>
        </linearGradient>

        <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ac7cff"/>
            <stop offset="1" stop-color="#5c63ff"/>
        </linearGradient>

        <filter id="glow">
            <feGaussianBlur stdDeviation="11" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <style>
        .flow {
            stroke-dasharray: 10 12;
            animation: dash 7s linear infinite;
        }

        .rotate {
            animation: rotate 14s linear infinite;
            transform-origin: 260px 295px;
        }

        .pulse {
            animation: pulse 3s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes dash {
            to { stroke-dashoffset: -150; }
        }

        @keyframes rotate {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            50% { opacity: .72; transform: scale(.96); }
        }
    </style>

    <rect
        x="1"
        y="1"
        width="518"
        height="598"
        rx="38"
        fill="url(#bg)"
        stroke="#38365f"
        stroke-width="2"
    />

    <g opacity=".13" stroke="#9f86ff">
        <path d="M0 105H520"/>
        <path d="M0 200H520"/>
        <path d="M0 295H520"/>
        <path d="M0 390H520"/>
        <path d="M0 485H520"/>
        <path d="M100 0V600"/>
        <path d="M200 0V600"/>
        <path d="M300 0V600"/>
        <path d="M400 0V600"/>
    </g>

    <text
        x="47"
        y="65"
        fill="#edf0ff"
        font-family="Arial, sans-serif"
        font-size="16"
        font-weight="700"
        letter-spacing="1"
    >
        WORKFLOW AUTOMATION
    </text>

    <rect
        x="365"
        y="42"
        width="108"
        height="30"
        rx="15"
        fill="#241c40"
        stroke="#765ac5"
    />

    <circle cx="382" cy="57" r="5" fill="#b388ff"/>

    <text
        x="395"
        y="61"
        fill="#bfa2ff"
        font-family="Arial, sans-serif"
        font-size="10"
        font-weight="700"
    >
        RUNNING
    </text>

    <path
        class="flow"
        d="M140 172C190 172 190 263 223 263"
        fill="none"
        stroke="#728cff"
        stroke-width="5"
        stroke-linecap="round"
    />

    <path
        class="flow"
        d="M297 263C335 263 338 172 385 172"
        fill="none"
        stroke="#a576ff"
        stroke-width="5"
        stroke-linecap="round"
    />

    <path
        class="flow"
        d="M260 333V428"
        fill="none"
        stroke="#56d9b4"
        stroke-width="5"
        stroke-linecap="round"
    />

    <g>
        <rect
            x="55"
            y="118"
            width="135"
            height="108"
            rx="23"
            fill="#111b2d"
            stroke="#38527b"
            stroke-width="2"
        />

        <circle cx="92" cy="157" r="17" fill="#263e6c"/>

        <path
            d="M84 157h16M92 149v16"
            stroke="#7e9dff"
            stroke-width="4"
            stroke-linecap="round"
        />

        <text
            x="118"
            y="153"
            fill="#f1f4ff"
            font-family="Arial, sans-serif"
            font-size="14"
            font-weight="700"
        >
            Trigger
        </text>

        <text
            x="118"
            y="176"
            fill="#7f8ba3"
            font-family="Arial, sans-serif"
            font-size="10"
        >
            Input sistem
        </text>
    </g>

    <g>
        <rect
            x="330"
            y="118"
            width="135"
            height="108"
            rx="23"
            fill="#111b2d"
            stroke="#664d8f"
            stroke-width="2"
        />

        <circle cx="367" cy="157" r="17" fill="#38275b"/>

        <path
            d="m359 157 6 6 12-15"
            fill="none"
            stroke="#bd8cff"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"
        />

        <text
            x="393"
            y="153"
            fill="#f1f4ff"
            font-family="Arial, sans-serif"
            font-size="14"
            font-weight="700"
        >
            Action
        </text>

        <text
            x="393"
            y="176"
            fill="#7f8ba3"
            font-family="Arial, sans-serif"
            font-size="10"
        >
            Tugas otomatis
        </text>
    </g>

    <circle
        cx="260"
        cy="295"
        r="95"
        fill="#6b63ff"
        opacity=".13"
        filter="url(#glow)"
    />

    <g class="rotate" opacity=".75">
        <circle
            cx="260"
            cy="295"
            r="75"
            fill="none"
            stroke="#8b75ff"
            stroke-width="3"
            stroke-dasharray="8 14"
        />

        <circle cx="260" cy="220" r="7" fill="#ba8dff"/>
        <circle cx="335" cy="295" r="7" fill="#6d8fff"/>
        <circle cx="260" cy="370" r="7" fill="#50dcb5"/>
        <circle cx="185" cy="295" r="7" fill="#768eff"/>
    </g>

    <g class="pulse">
        <rect
            x="215"
            y="250"
            width="90"
            height="90"
            rx="28"
            fill="url(#purple)"
            filter="url(#glow)"
        />

        <path
            d="M241 276h38M241 295h38M241 314h25"
            stroke="#fff"
            stroke-width="7"
            stroke-linecap="round"
        />
    </g>

    <g>
        <rect
            x="145"
            y="428"
            width="230"
            height="96"
            rx="22"
            fill="#101b2b"
            stroke="#287b69"
            stroke-width="2"
        />

        <circle cx="184" cy="476" r="19" fill="#16483e"/>

        <path
            d="m175 476 7 7 13-17"
            fill="none"
            stroke="#55e0b7"
            stroke-width="5"
            stroke-linecap="round"
            stroke-linejoin="round"
        />

        <text
            x="219"
            y="470"
            fill="#eef7f5"
            font-family="Arial, sans-serif"
            font-size="15"
            font-weight="700"
        >
            Proses Selesai
        </text>

        <text
            x="219"
            y="493"
            fill="#7c8da4"
            font-family="Arial, sans-serif"
            font-size="10"
        >
            Aktivitas tercatat dan terukur
        </text>
    </g>
</svg>
