    <text x="250" y="350" fill="#182541" font-family="Arial"
          font-size="18" font-weight="700">Publishing Platforms</text>

    <g font-family="Arial" font-size="13" text-anchor="middle">
        <g transform="translate(250 375)">
            <rect width="165" height="118" rx="24" fill="#fff" fill-opacity=".42" stroke="#a9bee4"/>
            <circle cx="82" cy="42" r="22" fill="#111"/>
            <text x="82" y="84" fill="#182541" font-weight="700">TikTok</text>
            <text x="82" y="105" fill="#77849c" font-size="10">Not connected</text>
        </g>

        <g transform="translate(430 375)">
            <rect width="165" height="118" rx="24" fill="#fff" fill-opacity=".42" stroke="#a9bee4"/>
            <circle cx="82" cy="42" r="22" fill="#347cff"/>
            <text x="82" y="84" fill="#182541" font-weight="700">Facebook</text>
            <text x="82" y="105" fill="#77849c" font-size="10">Not connected</text>
        </g>

        <g transform="translate(610 375)">
            <rect width="165" height="118" rx="24" fill="#fff" fill-opacity=".42" stroke="#a9bee4"/>
            <circle cx="82" cy="42" r="22" fill="#fd5c63"/>
            <text x="82" y="84" fill="#182541" font-weight="700">Instagram</text>
            <text x="82" y="105" fill="#77849c" font-size="10">Coming soon</text>
        </g>

        <g transform="translate(790 375)">
            <rect width="165" height="118" rx="24" fill="#fff" fill-opacity=".42" stroke="#a9bee4"/>
            <circle cx="82" cy="42" r="22" fill="#ff2020"/>
            <text x="82" y="84" fill="#182541" font-weight="700">YouTube</text>
            <text x="82" y="105" fill="#77849c" font-size="10">Coming soon</text>
        </g>

        <g transform="translate(970 375)">
            <rect width="165" height="118" rx="24" fill="#fff" fill-opacity=".42" stroke="#a9bee4"/>
            <circle cx="82" cy="42" r="22" fill="#ee2546"/>
            <text x="82" y="84" fill="#182541" font-weight="700">Pinterest</text>
            <text x="82" y="105" fill="#77849c" font-size="10">Coming soon</text>
        </g>
    </g>

    <rect x="250" y="535" width="910" height="150" rx="27"
          fill="#fff" fill-opacity=".47" stroke="#a9bee4"/>

    <circle cx="705" cy="590" r="25" fill="#fff" fill-opacity=".65"/>
    <text x="705" y="638" fill="#182541" font-family="Arial"
          font-size="15" font-weight="700" text-anchor="middle">No connected accounts yet</text>
    <text x="705" y="661" fill="#6d7a91" font-family="Arial"
          font-size="11" text-anchor="middle">Hubungkan akun untuk mulai melakukan publikasi.</text>
</svg>
