server {
    listen 80;
    listen [::]:80;
    server_name commerce.nexapa.app;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name commerce.nexapa.app;

    root /var/www/nexapa-commerce-admin;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/commerce.nexapa.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/commerce.nexapa.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
